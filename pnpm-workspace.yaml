minimumReleaseAgeExclude:
  # ecosystem-ci smoke test: preview builds and freshly pinned toolchain packages
  - '@oxc-project/*'
  - oxlint
  - oxfmt
  - oxlint-tsgolint
  - '@oxlint-tsgolint/*'
  - vitest
  - tinybench
  - yuku-core
  - yuku-parser
  - '@yuku-core/*'
  - '@yuku-toolchain/*'
  - '@voidzero-dev/*'
  - vite-plus
  - '@vitest/*'
  - undici
  - '@oxfmt/*'
  - '@oxlint/*'
  - oxfmt@0.70.0
  - oxlint@1.85.0
overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.0.0-commit.6a30b43184ad1c159091d51d728ee8c249392aa1
  vitest: 5.0.5
  vite-plus: 0.0.0-commit.6a30b43184ad1c159091d51d728ee8c249392aa1
  '@vitest/coverage-v8': 5.0.5
