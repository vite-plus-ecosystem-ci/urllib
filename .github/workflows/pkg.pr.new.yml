name: Publish Any Commit
on: [push, pull_request]

jobs:
  build:
    concurrency:
      group: pkg-pr-new-${{ github.workflow }}-#${{ github.event.pull_request.number || github.head_ref || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # main
        with:
          node-version: 22
          cache: true
          # The Socket proxy cannot fetch preview metadata from the registry bridge.
          sfw: ${{ github.repository_owner != 'vite-plus-ecosystem-ci' }}

      - name: Build
        run: vp run build

      - run: vp dlx pkg-pr-new publish
        # Ecosystem smoke test: publishing needs credentials unavailable on the fork.
        if: ${{ github.repository_owner != 'vite-plus-ecosystem-ci' }}
        name: Publish preview package
