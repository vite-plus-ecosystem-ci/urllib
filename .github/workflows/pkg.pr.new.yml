name: Publish Any Commit
on: [push, pull_request]

jobs:
  build:
    concurrency:
      group: pkg-pr-new-${{ github.workflow }}-#${{ github.event.pull_request.number || github.head_ref || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@6a60d12bdb8382f7ce636a9a846dc61e69855b2b # main
        with:
          node-version: 24
          cache: true
          sfw: true

      - name: Build
        run: vp run build

      # Ecosystem-ci smoke test: publishing a preview package needs a GitHub App or
      # token the fork does not have, and it does not exercise the pinned Vite+.
      - name: Run vp dlx pkg-pr-new publish
        if: ${{ github.repository_owner != 'vite-plus-ecosystem-ci' }}
        run: vp dlx pkg-pr-new publish
