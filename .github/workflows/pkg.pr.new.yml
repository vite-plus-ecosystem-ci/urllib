name: Publish Any Commit
on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    concurrency:
      group: pkg-pr-new-${{ github.workflow }}-#${{ github.event.pull_request.number || github.head_ref || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@6eb3ef76e48ad5aca2d217e4ee277786b3865699 # main
        with:
          node-version: 24
          cache: true
          sfw: true

      - name: Build
        run: vp run build

      # Ecosystem-ci smoke test: publishing a preview package needs a GitHub App or
      # token the fork does not have, and it does not exercise the pinned Vite+.
      - name: Run vp dlx pkg-pr-new publish
        if: ${{ github.repository_owner != 'vite-plus-ecosystem-ci' }}
        run: vp dlx pkg-pr-new publish
