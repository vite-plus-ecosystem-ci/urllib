name: CodSpeed

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@403a53cf6948470392f38eb47dea60b2271d37ea # main
        with:
          node-version: '24'
          cache: true

      # Ecosystem-ci smoke test: CodSpeed rejects the upload without the upstream
      # token (401). Run the same benchmarks on the fork, without the upload.
      - name: Run benchmarks
        if: ${{ github.repository_owner != 'vite-plus-ecosystem-ci' }}
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: vp test bench --run

      - name: Run benchmarks (no CodSpeed upload)
        if: ${{ github.repository_owner == 'vite-plus-ecosystem-ci' }}
        run: vp test bench --run
