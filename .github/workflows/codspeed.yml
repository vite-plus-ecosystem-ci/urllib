name: CodSpeed

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@6eb3ef76e48ad5aca2d217e4ee277786b3865699 # main
        with:
          node-version: '24'
          cache: true

      # Ecosystem-ci smoke test: CodSpeed rejects the upload without the upstream
      # token (401). Run the same benchmarks on the fork, without the upload.
      - name: Run benchmarks
        if: ${{ github.repository_owner != 'vite-plus-ecosystem-ci' }}
        # Ecosystem-ci smoke test: CodSpeed moved its v5 tag to v5.6.0 after the base
        # commit, so zizmor's ref-version-mismatch audit fails the CI check job on
        # its first step. The pinned SHA is v5.5.0; only the comment changes.
        uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da # v5.5.0
        with:
          mode: simulation
          run: vp test bench --run

      - name: Run benchmarks (no CodSpeed upload)
        if: ${{ github.repository_owner == 'vite-plus-ecosystem-ci' }}
        run: vp test bench --run
